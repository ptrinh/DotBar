name: DotBar
options:
  bundleIdPrefix: uk.trinh
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.13"
    CURRENT_PROJECT_VERSION: "50"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      LLVM_LTO: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      STRIP_SWIFT_SYMBOLS: YES
      COPY_PHASE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      DEPLOYMENT_POSTPROCESSING: YES
      SWIFT_ENFORCE_EXCLUSIVE_ACCESS: compile-time
      ENABLE_TESTABILITY: NO
      SWIFT_ENABLE_LIBRARY_EVOLUTION: NO
      # Cross-module inlining across the Swift sources on top of -Osize/WMO.
      SWIFT_LTO: YES
      # Drop load commands for autolinked dylibs no symbol actually needs.
      OTHER_LDFLAGS: "-Wl,-dead_strip_dylibs"
      # NOTE: do NOT add -Xfrontend -disable-reflection-metadata. SwiftUI needs reflection
      # to discover @ObservedObject/@State in views; without it Release builds stop re-rendering.
targets:
  DotBar:
    type: application
    platform: macOS
    sources:
      - path: DotBar
        excludes: ["Resources/Info.plist", "Resources/DotBar-AppStore.entitlements"]
      - path: DotBar/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: DotBar/Resources/Info.plist
      properties:
        CFBundleName: DotBar
        CFBundleDisplayName: DotBar
        CFBundleIdentifier: uk.trinh.DotBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Phil Trinh. All rights reserved."
        NSPrincipalClass: NSApplication
        # Safe: items.json is written atomically on every model change, so there is
        # nothing to flush at shutdown. Lets the system skip us at logout/restart.
        NSSupportsSuddenTermination: true
        CFBundleURLTypes:
          - CFBundleURLName: DotBar URL
            CFBundleURLSchemes: [dotbar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.trinh.DotBar
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
